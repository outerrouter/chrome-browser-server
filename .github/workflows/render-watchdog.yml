name: Render timed watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "How long to keep Render awake (0 disables the watchdog)"
        required: true
        default: "60"
        type: string

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Set or clear watchdog duration
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          DURATION: ${{ inputs.duration_minutes }}
        run: |
          set -euo pipefail
          if ! [[ "$DURATION" =~ ^[0-9]+$ ]]; then
            echo "duration_minutes must be a non-negative integer" >&2
            exit 1
          fi
          if [ "$DURATION" = "0" ]; then
            until="DISABLED"
          else
            until=$(date -u -d "+${DURATION} minutes" +%Y-%m-%dT%H:%M:%SZ)
          fi
          body=$(UNTIL="$until" python3 -c 'import json,os; print(json.dumps({"name":"KEEPALIVE_UNTIL_UTC","value":os.environ["UNTIL"]}))')
          curl --fail-with-body -sS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/variables/KEEPALIVE_UNTIL_UTC" \
            -d "$body"
          echo "watchdog_until_utc=$until"

      - name: Ping Render while within the configured window
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/variables/KEEPALIVE_UNTIL_UTC")
          until=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))')
          if [ -z "$until" ] || [ "$until" = "DISABLED" ]; then
            echo "watchdog disabled; no Render request sent"
            exit 0
          fi
          now=$(date -u +%s)
          end=$(date -u -d "$until" +%s)
          if [ "$now" -ge "$end" ]; then
            echo "watchdog expired at $until; disabling"
            body='{"name":"KEEPALIVE_UNTIL_UTC","value":"DISABLED"}'
            curl --fail-with-body -sS -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/variables/KEEPALIVE_UNTIL_UTC" \
              -d "$body"
            exit 0
          fi
          code=$(curl -sS -o /tmp/render-health.txt -w '%{http_code}' --max-time 90 \
            "https://chrome-browser-server.onrender.com/healthz")
          echo "Render health status: $code; watchdog ends: $until"
          test "$code" = "200"
