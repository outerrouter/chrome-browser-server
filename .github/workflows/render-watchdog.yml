name: Render timed watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "How long to keep Render awake (0 disables the watchdog)"
        required: true
        default: "60"
        type: string

permissions:
  contents: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out watchdog state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set or clear watchdog duration
        if: github.event_name == 'workflow_dispatch'
        env:
          DURATION: ${{ inputs.duration_minutes }}
        run: |
          set -euo pipefail
          if ! [[ "$DURATION" =~ ^[0-9]+$ ]]; then
            echo "duration_minutes must be a non-negative integer" >&2
            exit 1
          fi
          if [ "$DURATION" = "0" ]; then
            until="DISABLED"
          else
            until=$(date -u -d "+${DURATION} minutes" +%Y-%m-%dT%H:%M:%SZ)
          fi
          printf '%s\n' "$until" > .render-watchdog-until
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .render-watchdog-until
          if git diff --cached --quiet; then
            echo "watchdog state already $until"
          else
            git commit -m "Set Render watchdog expiry"
            git push
          fi
          echo "watchdog_until_utc=$until"

      - name: Ping Render while within the configured window
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          until=$(cat .render-watchdog-until 2>/dev/null || printf 'DISABLED')
          if [ -z "$until" ] || [ "$until" = "DISABLED" ]; then
            echo "watchdog disabled; no Render request sent"
            exit 0
          fi
          now=$(date -u +%s)
          end=$(date -u -d "$until" +%s)
          if [ "$now" -ge "$end" ]; then
            echo "watchdog expired at $until; disabling"
            printf 'DISABLED\n' > .render-watchdog-until
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .render-watchdog-until
            git commit -m "Disable expired Render watchdog"
            git push
            exit 0
          fi
          code=$(curl -sS -o /tmp/render-health.txt -w '%{http_code}' --max-time 90 \
            "https://chrome-browser-server.onrender.com/healthz")
          echo "Render health status: $code; watchdog ends: $until"
          test "$code" = "200"
