services:
  - type: web
    name: chrome-browser-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: BROWSER_PANEL_USER
        value: browser
      - key: BROWSER_PANEL_PASSWORD
        sync: false
      - key: SE_VNC_PASSWORD
        sync: false
      - key: MCP_BROWSER_TIMEOUT_SECONDS
        value: "30"
      - key: KEEPALIVE_URLS
        value: https://example.com
      - key: KEEPALIVE_INTERVAL_SECONDS
        value: "60"
      - key: BROWSER_DURATION_MINUTES
        value: "0"
      - key: SE_SCREEN_WIDTH
        value: "1440"
      - key: SE_SCREEN_HEIGHT
        value: "900"
      - key: SE_RECORD_VIDEO
        value: "false"
      - key: SE_VIDEO_RECORDING
        value: "false"
