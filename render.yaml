services:
  - type: web
    name: chrome-browser-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: BROWSER_PANEL_USER
        value: browser
      - key: BROWSER_PANEL_PASSWORD
        sync: false
      - key: SE_VNC_PASSWORD
        sync: false
      - key: MCP_BROWSER_TIMEOUT_SECONDS
        value: "30"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: AGENT_LLM_BASE_URL
        sync: false
      - key: AGENT_LLM_MODEL
        sync: false
      - key: AGENT_LLM_API_KEY
        sync: false
      - key: AGENT_MAX_STEPS
        value: "100"
      - key: AGENT_ACTION_RETRIES
        value: "2"
      - key: AGENT_LLM_BASE_URL
        sync: false
      - key: AGENT_LLM_MODEL
        sync: false
      - key: AGENT_LLM_API_KEY
        sync: false
      - key: KEEPALIVE_URLS
        value: https://example.com
      - key: KEEPALIVE_INTERVAL_SECONDS
        value: "60"
      - key: BROWSER_DURATION_MINUTES
        value: "0"
      - key: SE_SCREEN_WIDTH
        value: "1440"
      - key: SE_SCREEN_HEIGHT
        value: "900"
      - key: SE_RECORD_VIDEO
        value: "false"
      - key: SE_VIDEO_RECORDING
        value: "false"
